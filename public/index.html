<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanakornshop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090611;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px;background:linear-gradient(135deg,#160b29,#531080)}
h1{color:#e0b2ff;text-shadow:0 0 15px #b43cff}
main{max-width:850px;margin:30px auto;padding:15px}
.card{background:#191025;border:1px solid #8139b9;border-radius:16px;padding:20px;margin-bottom:20px}
.product{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.price{font-size:25px;color:#dca4ff;font-weight:bold}
button{background:#8d35d4;color:white;border:0;border-radius:9px;padding:12px 20px}
small{color:#bda8ce}
footer{text-align:center;padding:25px;color:#927da4}
</style>
</head>
<body>
<header>
<h1>Thanakornshop</h1>
<p>GAMING SHOP • ร้านค้าเกมมิ่ง</p>
</header>
<main>
<div class="card">
<h2>ยินดีต้อนรับสู่ Thanakornshop</h2>
<p>ร้านค้าเกมมิ่ง ธีมดำม่วง Neon</p>
</div>
<div class="card">
<h2>สินค้าแนะนำ</h2>
<div class="product">
<div>
<h3>ID เผ่า V4</h3>
<small>รหัสสินค้า TBN001</small>
<p>สอบถามผู้ดูแลร้านก่อนสั่งซื้อ</p>
</div>
<div>
<div class="price">฿59</div>
<button onclick="alert('ระบบสั่งซื้อยังไม่เปิดใช้งาน')">ดูสินค้า</button>
</div>
</div>
</div>
</main>
<footer>© 2026 Thanakornshop</footer>
</body>
</html>
